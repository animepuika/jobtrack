spring.application.name=jobtrack

# Local PostgreSQL from compose.yaml. Override with environment variables elsewhere.
spring.datasource.url=${JOBTRACK_DB_URL:jdbc:postgresql://localhost:5432/jobtrack}
spring.datasource.username=${JOBTRACK_DB_USERNAME:jobtrack}
spring.datasource.password=${JOBTRACK_DB_PASSWORD:jobtrack}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

jobtrack.time-zone=${JOBTRACK_TIME_ZONE:Europe/Riga}
jobtrack.bootstrap-user.username=${JOBTRACK_USERNAME:}
jobtrack.bootstrap-user.password=${JOBTRACK_PASSWORD:}

jobtrack.hiringcafe.enabled=${JOBTRACK_HIRINGCAFE_ENABLED:true}
jobtrack.hiringcafe.endpoint=https://hiringcafe.com/api/mcp
jobtrack.hiringcafe.connect-timeout=3s
jobtrack.hiringcafe.read-timeout=10s
jobtrack.hiringcafe.max-results=10
