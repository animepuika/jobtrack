<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="narrow">
	<h1>Sign in</h1>
	<p class="flash error" role="alert" th:if="${param.error}">Wrong username or password.</p>
	<p class="flash success" role="status" th:if="${param.logout}">You are signed out.</p>
	<form th:action="@{/login}" method="post" class="card stack">
		<label>Username
			<input type="text" name="username" autocomplete="username" required autofocus>
		</label>
		<label>Password
			<input type="password" name="password" autocomplete="current-password" required>
		</label>
		<button type="submit" class="primary">Sign in</button>
	</form>
</main>
</body>
</html>
