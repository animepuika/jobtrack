spring.application.name=reminder-service
server.port=${PORT:8081}

# The service's own database, separate from the tracker's.
spring.datasource.url=${REMINDERS_DB_URL:jdbc:postgresql://localhost:5433/reminders}
spring.datasource.username=${REMINDERS_DB_USERNAME:reminders}
spring.datasource.password=${REMINDERS_DB_PASSWORD:reminders}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Events from the tracker. Locally this is Azurite's documented development account,
# not a secret; in Azure the connection string comes from configuration.
reminders.queue.enabled=${REMINDERS_QUEUE_ENABLED:true}
reminders.queue.connection-string=${REMINDERS_QUEUE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;}
reminders.queue.poll-delay=1s

# Shared with the tracker. The default only works locally; set a long random value
# anywhere else.
reminders.internal-api.token=${REMINDERS_INTERNAL_TOKEN:local-development-token}
