name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: app/pom.xml

      # Integration tests start PostgreSQL 18 in Docker with Testcontainers. No test
      # contacts HiringCafe; the adapter is tested against a local fake server.
      - name: Test and package
        run: ./mvnw -B verify

      - name: Build the Docker image
        run: docker build --tag jobtrack:ci .

      - name: Check the image holds only the app
        run: |
          files="$(docker run --rm --entrypoint find jobtrack:ci /app -type f)"
          echo "$files"
          test "$files" = "/app/app.jar"
