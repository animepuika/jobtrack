name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [app, reminder-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      # Integration tests start PostgreSQL 18 (and, for the reminder service, Azurite)
      # in Docker with Testcontainers. No test contacts HiringCafe.
      - name: Test and package
        run: ./mvnw -B verify

      - name: Build the Docker image
        run: docker build --tag ${{ matrix.service }}:ci .

      - name: Check the image holds only the app
        run: |
          files="$(docker run --rm --entrypoint find ${{ matrix.service }}:ci /app -type f)"
          echo "$files"
          test "$files" = "/app/app.jar"

  # After the tests pass on main, publish both images to GitHub's container registry
  # so the Azure lab (infra/) can pull them. Pull requests never publish.
  publish:
    name: publish ${{ matrix.service }}
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [app, reminder-service]
    steps:
      - uses: actions/checkout@v7

      - name: Build and push
        working-directory: ${{ matrix.service }}
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/jobtrack-${{ matrix.service }}
        run: |
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
